name: laravel-ci

on:
  push:
    paths: ['laravel/**', '.github/workflows/laravel-ci.yml']
  pull_request:
    paths: ['laravel/**', '.github/workflows/laravel-ci.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: dmc_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, bcmath, zip, gd

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cat > .env <<'EOF'
          APP_NAME="DMC Internal Medicine"
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost
          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=dmc_test
          DB_USERNAME=root
          DB_PASSWORD=
          SESSION_DRIVER=array
          CACHE_STORE=array
          QUEUE_CONNECTION=sync
          MAIL_MAILER=array
          EOF
          php artisan key:generate

      - name: Run test suite (PHPUnit, MySQL)
        run: php artisan test

      - name: Dependency advisories (composer)
        # advisory-only for now (won't block on an as-yet-unvetted CVE); promote to a hard gate
        # once a clean run is confirmed.
        run: composer audit --no-interaction || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: laravel/package-lock.json

      - name: Build front-end (catches Vue/Inertia build breakage)
        run: npm ci && npm run build

      - name: Front-end unit tests (Vitest)
        run: npm run test

      - name: Dependency advisories (npm, production)
        run: npm audit --omit=dev
