name: Laravel CI

# CI for the Laravel re-platform (`laravel/`). The monorepo root also holds the legacy PHP
# app, which has its own separate pipeline at .github/workflows/ci.yml ("Legacy CI") — do not
# merge them. What each job gates, and how to change a gate, is documented in laravel/docs/CI.md.
#
# Four independent jobs gate every push/PR to `main`; a fifth, `release`, runs only on a pushed tag:
#  - frontend : npm ci, the vitest-axe accessibility gate, Vitest, production build, the allow-list +
#               contrast style gates, and a build-reproducibility check (public/build is committed and
#               must be exactly what `npm run build` regenerates from source).
#  - backend  : Composer install against a real MySQL 8 service (phpunit.xml runs RefreshDatabase
#               against MySQL so the actual SQL dialect — DATEDIFF/DATE_FORMAT/JSON — is exercised),
#               a BLOCKING composer audit (high/critical advisories fail unless listed, with a reason
#               and review date, in laravel/.composer-audit-ignore.json), then the project's
#               established two-pass PHPUnit run (the `pdf` group is isolated in its own process —
#               dompdf's native font-compression state segfaults PHP if run in the same long-lived
#               process as the rest of the suite).
#  - secrets  : gitleaks over the pushed commits / PR commits, with laravel/.gitleaks.toml.
#  - sast     : Semgrep (p/php, p/owasp-top-ten, p/javascript) over app/, routes/ and resources/js;
#               ERROR-severity findings fail the job, the SARIF goes to the Security tab.
#  - release  : CICD-05. Gated on a pushed `vYYYY.MM.DD` tag only (never a branch push or PR — not a
#               required status check). Rebuilds the CycloneDX SBOM and tars up the committed
#               public/build plus both lock files — the bytes that actually reach production — then
#               signs both with actions/attest-build-provenance and archives them on the run. It does
#               not re-run the four jobs above: branch protection already required them green before
#               the tagged commit could reach `main`. Details: laravel/docs/CI.md.
#
# Neither test job hard-codes a test count or snapshot value — the gates themselves are the assertion.
#
# Every `uses:` is pinned to a full commit SHA (the tag it was resolved from is the trailing
# comment) and the Semgrep image to a digest, so a re-tagged upstream release cannot change what
# runs here. Bump by resolving the new tag with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>   (dereference annotated tags via git/tags/<sha>)
# and updating both the SHA and the comment.

# Least privilege: the workflow-level token is read-only. Untrusted dependency install scripts
# (npm ci / composer install) and third-party scanners run here, so a poisoned dep or action cannot
# use the token to push to the repo. Jobs that need more (the SAST job uploads SARIF to code
# scanning; the secret-scan job lists PR commits) widen it for themselves only, below.
permissions:
  contents: read

# No path filter on purpose (2026-09-03): the four jobs are REQUIRED status checks on `main` with
# the rule enforced for admins. A required check that does not run because a commit touched no
# matching path shows as "Expected — waiting" and blocks the merge forever, so CI runs on every
# push and PR to `main`, docs-only ones included (~4 min). The legacy pipeline (ci.yml) keeps its
# own path filter; it is not a required check.
#
# `tags: ['v*']` (added 2026-09-22, CICD-05) exists ONLY to gate the `release` job below on a
# pushed release tag (scheme: laravel/docs/RELEASE-CHECKLIST.md). A tag push still satisfies this
# same `on.push` trigger, which would otherwise also re-run frontend/backend/secrets/sast a
# redundant fifth time — each of those four jobs therefore carries its own
# `if: ${{ !startsWith(github.ref, 'refs/tags/') }}` guard so their run conditions are exactly what
# they were before this line was added (push/PR to `main` only).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Vitest, axe, build, style gates)
    # Guards against the `tags: ['v*']` trigger added for the `release` job — keeps this job's run
    # conditions exactly push/PR to `main`, unchanged from before that trigger existed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: laravel/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # moderate+ blocks; low-severity advisories don't fail the build (the lockfile currently
      # carries one low esbuild advisory — bump it, then consider tightening the level).
      - name: Dependency advisories (npm, production)
        run: npm audit --omit=dev --audit-level=moderate

      # axe-core (via vitest-axe) over the three consultation-ledger pages mounted with
      # representative props. Any violation fails. It is also part of the full Vitest run below;
      # it runs on its own first so an accessibility regression is named as such in the run list.
      # BLOCKING (TST-04): ESLint recommended + eslint-plugin-vue essential over resources/js
      # (eslint.config.js). Zero warnings allowed so the count cannot creep.
      - name: Lint (ESLint + eslint-plugin-vue) — blocking
        run: npm run lint

      - name: Accessibility gate (vitest-axe)
        run: npx vitest run resources/js/__tests__/a11y.axe.spec.js

      - name: Unit tests (Vitest)
        # --coverage enforces the thresholds in vitest.config.js (TST-02 floor); a drop fails the job.
        run: npx vitest run --coverage

      - name: Build front-end assets
        run: npm run build

      - name: Class allow-list drift guard
        run: npm run check-allowlist

      - name: Accessibility contrast + perceptual-distance gate
        run: node scripts/contrast.mjs

      - name: Verify public/build is reproducible from source
        # public/build is committed so the app can be deployed without a Node toolchain on the
        # server. If it drifts from what `npm run build` produces (modified OR new/untracked
        # files), the committed bundle no longer matches source — fail loudly.
        run: |
          echo "git status for public/build after 'npm run build':"
          git status --porcelain -- public/build
          if [ -n "$(git status --porcelain -- public/build)" ]; then
            echo "::error::public/build differs from source. Run 'npm run build' locally and commit the result."
            exit 1
          fi

  backend:
    name: Backend (PHPUnit, MySQL, composer audit)
    # Guards against the `tags: ['v*']` trigger added for the `release` job — keeps this job's run
    # conditions exactly push/PR to `main`, unchanged from before that trigger existed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: laravel
    services:
      mysql:
        image: mysql:8.4   # production runs MySQL 8.4 (docs/DEPLOY-LARAVEL.md §0) — test the shipped runtime
        env:
          MYSQL_DATABASE: dmc_test
          # phpunit.xml sets DB_DATABASE=dmc_test but not DB_HOST/PORT/USERNAME/PASSWORD, so those
          # come from .env (copied from .env.example below): host 127.0.0.1, port 3306, user root,
          # empty password. Mirror that here rather than editing phpunit.xml.
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'   # production image is PHP 8.3 (Nixpacks, composer.json "php": "^8.3") — test the shipped runtime
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          # pcov for the PHP coverage floor (TST-02). First attempt on 2026-09-03 printed no table:
          # Collision renders it with Termwind, which needs a terminal width — the runner has none.
          # COLUMNS/TERM are set on the test step for that reason; if the table still does not
          # render, the fallback is a clover report gated by a small script.
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # BLOCKING. `composer audit` itself exits non-zero for ANY advisory (medium/low included), so
      # its exit code is captured, not acted on; scripts/composer-audit-gate.php is the arbiter:
      # high/critical (or severity-less) advisories fail unless listed — with a reason and a review
      # date — in .composer-audit-ignore.json. A missing/invalid report is a failure, never a pass.
      - name: Dependency advisories (composer) — high/critical block
        run: |
          set +e
          composer audit --no-interaction --format=json --locked > composer-audit.json
          echo "composer audit exit code: $? (non-zero whenever any advisory exists — the gate below decides)"
          set -e
          php scripts/composer-audit-gate.php composer-audit.json .composer-audit-ignore.json

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MySQL to accept connections
        run: |
          until mysqladmin ping -h127.0.0.1 --silent; do
            sleep 1
          done

      # BLOCKING. The backup/PITR tooling is Python that runs as root on the database host, outside
      # every container and outside PHPUnit's reach — so without this step nothing exercised it on
      # any push. Stdlib only; the Ubuntu runner already has python3 and openssl, which is the whole
      # dependency list (the end-to-end cases skip themselves if openssl is ever missing).
      - name: Backup tooling unit tests (Python)
        working-directory: laravel/scripts/backup
        run: python3 -m unittest -v test_db_backup test_binlog_ship

      - name: Test suite — pass 1 (exclude pdf group; collects coverage)
        # Coverage is collected by PHPUnit itself into a Clover file (pcov driver from setup-php).
        # `php artisan test --coverage --min` was tried twice and Collision printed no table on this
        # runner, so the floor is enforced by our own script from the Clover metrics instead.
        run: php artisan test --exclude-group pdf --coverage-clover coverage/clover.xml

      - name: PHP coverage floor (TST-02) — statements over app/
        # Measured 86.15% (5338/6196 statements) on 2026-09-03; floor sits three points under it.
        # Raise it as coverage grows, never lower it to make a build pass (a reason in the PR if it
        # must move down).
        run: php scripts/coverage-gate.php coverage/clover.xml 83

      - name: Test suite — pass 2 (pdf group, isolated process)
        # dompdf's native font-compression state accumulates across tests and segfaults PHP
        # ("Premature end of PHP process" inside gzcompress) if run in the same long pass as the
        # rest of the suite — a fresh process per pass avoids crossing that threshold.
        run: php artisan test --group pdf

      # BLOCKING. I18N-02: config/database.php deliberately pins no MySQL session timezone, so the
      # DB session runs in the DB host's zone (UTC) while the app runs Asia/Riyadh. Mixing the two
      # clocks skews a comparison by three hours and nothing fails visibly, so every raw MySQL clock
      # function in a string literal must be allow-listed with a reason in .clock-allowlist.json —
      # the only defensible one being that the column on the other side is DB-written (useCurrent).
      # Placed after the suite for the same reason as Pint: a guard trip must not hide test results.
      - name: Raw-clock guard (I18N-02) — blocking
        run: php scripts/clock-guard.php .clock-allowlist.json app routes database

      # CICD-05. A CycloneDX SBOM of both dependency trees, generated from composer.lock and
      # package-lock.json (dependency-free and deterministic — see scripts/sbom.php). Archived per
      # run so "what shipped on that date" is answerable after the fact. NOT an attestation: this
      # pipeline builds no release artifact to sign, since Coolify builds from source on the host.
      - name: Software Bill of Materials (CICD-05)
        run: php scripts/sbom.php sbom/dmc-laravel.cdx.json

      - name: Archive the SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          # `uses` steps ignore the job's working-directory default, so this is workspace-relative.
          path: laravel/sbom/dmc-laravel.cdx.json
          if-no-files-found: error
          retention-days: 90

      # BLOCKING, deliberately LAST so a style drift never hides the test results above it.
      # Laravel Pint (Laravel preset): the codebase was normalised once; any drift fails here.
      # Fix locally with `vendor/bin/pint` and commit the result.
      - name: Code style (Pint) — blocking
        run: vendor/bin/pint --test

  secrets:
    name: Secret scan (gitleaks)
    # Guards against the `tags: ['v*']` trigger added for the `release` job — keeps this job's run
    # conditions exactly push/PR to `main`, unchanged from before that trigger existed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the action lists a PR's commits through the API to know what to scan; read is enough —
      # PR commenting (which would need write) is switched off below.
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # the action scans the commit RANGE of the push / the PR's commits, so it needs history,
          # not just the checked-out tree
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # extends the default ruleset; its ONLY allow-list is the AWS-published SigV4 test vectors
          # used by laravel/tests/Unit/S3SigV4Test.php (matched by exact string AND path)
          GITLEAKS_CONFIG: laravel/.gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # GITLEAKS_LICENSE is not set: the repo belongs to a personal account, where the action
          # needs no licence. It becomes required the day this moves under a GitHub organisation.

  sast:
    name: SAST (Semgrep, ERROR severity blocks)
    # Guards against the `tags: ['v*']` trigger added for the `release` job — keeps this job's run
    # conditions exactly push/PR to `main`, unchanged from before that trigger existed.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # upload-sarif → the repository's Security tab (code scanning; available on a public repo).
      security-events: write
    container:
      # digest of the `1.175.0` / `latest` tag on Docker Hub as of 2026-09-03 — a re-pushed tag
      # cannot change what runs here. Bump by reading the new tag's digest from
      # https://hub.docker.com/v2/repositories/semgrep/semgrep/tags/<version>
      image: semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 # 1.175.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `--severity ERROR` restricts the run to ERROR-level rules; `--error` turns any finding into
      # exit 1. WARNING/INFO rules are not run — to surface them, drop --severity and gate on the
      # JSON separately (see laravel/docs/CI.md). Front-end test files are excluded: the gate is on
      # application code, and jsdom test fixtures legitimately build DOM from strings.
      - name: Semgrep (p/php, p/owasp-top-ten, p/javascript)
        run: |
          semgrep scan \
            --config p/php --config p/owasp-top-ten --config p/javascript \
            --severity ERROR --error \
            --exclude '__tests__' --exclude '*.test.js' --exclude '*.spec.js' \
            --sarif-output semgrep.sarif \
            --metrics=off \
            laravel/app laravel/routes laravel/resources/js

      # The gate result is the semgrep step above; this only publishes the findings. It runs even
      # when the scan failed (that is when it matters most) and cannot itself fail the job — e.g.
      # a fork PR's read-only token cannot upload, and that must not mask the scan's own verdict.
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  release:
    name: Release provenance (signed build attestation)
    # CICD-05. Runs ONLY on a pushed `vYYYY.MM.DD` release tag (laravel/docs/RELEASE-CHECKLIST.md) —
    # never on a branch push or a PR. Not a required status check and not in `needs:` of/on any of
    # the four jobs above: a tag is only ever pushed against a commit already on `main`, which
    # branch protection already required to pass all four checks before merge, so re-running them
    # here would be pure duplication. If that assumption is ever wrong (a tag pushed against a
    # non-`main` commit), this job still faithfully attests exactly what it built from that commit —
    # it just isn't a guarantee that commit passed CI, which the deploy step in
    # RELEASE-CHECKLIST.md is what actually checks.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Least privilege, scoped to this job only (workflow default stays `contents: read`, §top of
    # file): `id-token` lets actions/attest-build-provenance mint a short-lived OIDC token to sign
    # with Sigstore; `attestations: write` lets it publish the resulting attestation to this repo.
    # Deliberately NOT `contents: write`: this job never creates or modifies a GitHub Release, a
    # tag, or any repo content — see the note on the last step below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'   # matches the backend job and the production runtime (composer.json "php": "^8.3")
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath

      # Same generator the backend job already runs (CICD-05); re-run here so the SBOM in this
      # release's attested set matches composer.lock / package-lock.json AT THE TAGGED COMMIT, not
      # a copy carried over from whichever push-to-main CI run happened to build it. Deterministic
      # by construction (scripts/sbom.php), so this is not a second "version" of the SBOM — running
      # it again on the same lock files at the same commit reproduces the same bytes.
      - name: Software Bill of Materials (CycloneDX)
        run: php scripts/sbom.php sbom/dmc-laravel.cdx.json

      # The bytes that actually reach production: public/build is committed and Nixpacks never runs
      # Node on the host (CLAUDE.md §3), so the compiled frontend Coolify deploys IS this tree's
      # public/build, verbatim. composer.lock and package-lock.json are the exact dependency graphs
      # `composer install` / `npm ci` resolve from. Application source (app/, routes/,
      # resources/js/*.vue, …) is not repackaged here — the git tag is that provenance, and every
      # line of it already passed gitleaks/Semgrep/PHPUnit/Vitest before it could reach `main`.
      - name: Package the release artifact set
        run: |
          mkdir -p release
          tar -czf release/dmc-laravel-build.tar.gz public/build composer.lock package-lock.json
          tar -tzf release/dmc-laravel-build.tar.gz | head -20

      # Signs both files with a Sigstore identity bound to this repo, workflow, and commit (OIDC —
      # no maintainer-held signing key exists or is needed). `uses:` steps ignore the job's
      # working-directory default (same note as the SBOM upload in `backend`), so paths here are
      # workspace-relative.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            laravel/release/dmc-laravel-build.tar.gz
            laravel/sbom/dmc-laravel.cdx.json

      # Archived on the workflow run (90 days, matching the SBOM retention in `backend`) so the
      # exact attested bytes are downloadable without rebuilding. Deliberately NOT attached to a
      # GitHub Release: this job's permissions are read-only on `contents` (above) and uploading a
      # release asset needs `contents: write`, which is not worth granting just to save a manual
      # download — and there is no GitHub Release object in this project's process today anyway
      # (laravel/docs/RELEASE-CHECKLIST.md's release record is the annotated git tag itself). See
      # laravel/docs/CI.md for how to verify a downloaded copy with `gh attestation verify`.
      - name: Upload release artifact set to the workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.ref_name }}
          # `uses` steps ignore the job's working-directory default, so these are workspace-relative.
          path: |
            laravel/release/dmc-laravel-build.tar.gz
            laravel/sbom/dmc-laravel.cdx.json
          if-no-files-found: error
          retention-days: 90
