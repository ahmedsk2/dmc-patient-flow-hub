mysqli.max_links = 200

; --- Session hardening ---
; NOTE: session.cookie_secure = 1 requires HTTPS (the app forces HTTPS via .htaccess).
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

; --- Error handling: log server-side, never leak to clients in production ---
display_errors = Off
log_errors = On
